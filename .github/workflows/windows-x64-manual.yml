name: Windows x64 build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile EEZ Studio
        run: npm run build

      - name: Package Windows x64 application
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: eez-studio-windows-x64
          path: dist/**
          if-no-files-found: error
          retention-days: 14
