name: Windows x64 validation

on:
  pull_request:
    branches:
      - master
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "installation/**"
      - "tsconfig*.json"
      - "gulpfile.*"
      - ".github/workflows/windows-x64-validation.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile EEZ Studio
        run: npm run build

      - name: Package Windows x64 application
        run: npm run dist

      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist -Filter *.exe -File
          if ($installers.Count -eq 0) {
            throw "No Windows .exe installer was produced."
          }
          $installers | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: eez-studio-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
          retention-days: 14
